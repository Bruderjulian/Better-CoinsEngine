plugins {
    id 'java'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.0.0'
}

group = 'su.nightexpress.excellenteconomy'
version = '2.7.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'nightexpress-releases'
        url = 'https://repo.nightexpressdev.com/releases'
    }
    maven {
        name = 'jitpack'
        url = 'https://jitpack.io'
    }
    maven {
        name = 'placeholderapi'
        url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/'
    }
    maven {
        name = 'rosewood-repo'
        url = 'https://repo.rosewooddev.io/repository/public/'
    }
    maven {
        name = 'creatorfromhell-repo'
        url = 'https://repo.codemc.io/repository/creatorfromhell/'
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
    compileOnly 'me.clip:placeholderapi:2.12.3'
    compileOnly 'org.black_ixx:playerpoints:3.0.0'
    compileOnly 'com.github.ItzSave:DeluxeCoinflipAPI:1.0.4'
    compileOnly 'su.nightexpress.nightcore:2.16.4'
    compileOnly 'net.milkbowl.vault:VaultUnlockedAPI:2.16'
}

processResources {
    filteringCharset = 'UTF-8'
    filesMatching(['plugin.yml', 'paper-plugin.yml']) {
        expand(project.properties)
    }
}

shadowJar {
    archiveClassifier = ''
}

build {
    dependsOn shadowJar
}